name: CI

on:
  push:
    branches: [main, refactor/arch-v1]
  pull_request:
    branches: [main]

env:
  # 顶层 = 线上正式名（chsi-workers）；staging 显式覆盖成 chsi-workers-staging
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: rm -rf apps/api/.wrangler/test-state && pnpm --filter @chsi/api test

      - name: Build check
        run: |
          node --check apps/api/src/index.js
          test -f apps/web/public/index.html
          test -f apps/admin/public/index.html
          # 合并静态产物（web 前台 + admin 后台 → apps/api/dist）
          pnpm --filter @chsi/api build
          test -f apps/api/dist/index.html
          test -f apps/api/dist/admin/index.html
          # 部署前先在 CI 校验：每个 env 都真的带上了 KV/R2 绑定
          # （wrangler 的 env 不继承顶层 kv_namespaces / r2_buckets，漏写会静默部署出无绑定 Worker）
          cd apps/api
          for e in staging prod; do
            out=$(npx wrangler deploy --env "$e" --dry-run 2>&1)
            echo "$out" | grep -q 'env.KV (' || { echo "::error::env.$e 缺少 KV 绑定"; exit 1; }
            echo "$out" | grep -q 'env.R2 (' || { echo "::error::env.$e 缺少 R2 绑定"; exit 1; }
            echo "env.$e 绑定 OK"
          done

  deploy-staging:
    needs: ci
    if: github.ref == 'refs/heads/refactor/arch-v1' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build assets
        run: pnpm --filter @chsi/api build
      - name: Deploy staging (KV/R2 指向 staging 资源)
        run: pnpm --filter @chsi/api exec wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Set staging ADMIN_PASSWORD
        run: echo "$ADMIN_PASSWORD" | pnpm --filter @chsi/api exec wrangler secret put ADMIN_PASSWORD --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

  deploy-prod:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build assets
        run: pnpm --filter @chsi/api build
      - name: Deploy production
        run: pnpm --filter @chsi/api exec wrangler deploy --env prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Set production ADMIN_PASSWORD
        run: echo "$ADMIN_PASSWORD" | pnpm --filter @chsi/api exec wrangler secret put ADMIN_PASSWORD --env prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
