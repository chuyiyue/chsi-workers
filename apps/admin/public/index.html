<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - 学籍档案</title>
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<!-- 登录 -->
<div id="view-login" class="login-center" style="display:none">
  <div class="login-card">
    <h2>管理后台</h2>
    <p class="sub">学籍档案 · 演示系统</p>
    <form id="admin-login-form">
      <label class="fl">管理员账号</label>
      <input class="in" name="username" value="admin" autocomplete="username">
      <label class="fl">密码</label>
      <input class="in" name="password" type="password" autocomplete="current-password">
      <div class="msg" id="lmsg"></div>
      <button class="btn block" type="submit" style="margin-top:6px">登录</button>
    </form>
    <p class="demo-note">演示系统 · 与学信网无任何关联</p>
  </div>
</div>

<!-- 主界面 -->
<div id="view-app" class="shell" style="display:none">
  <aside class="sidebar">
    <div class="brand"><span class="t">档案管理</span><span class="tag">演示</span></div>
    <nav class="nav">
      <a href="#" class="active" data-nav="users">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        用户管理</a>
      <a href="#" data-nav="studs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></svg>
        学籍管理</a>
      <a href="#" data-nav="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        网站设置</a>
    </nav>
    <div class="side-foot">管理员：admin<br><button class="btn secondary sm" id="logout-btn">退出登录</button></div>
  </aside>

  <div class="main">
    <div class="topbar"><h1 id="page-title">用户管理</h1><div id="topbar-extra"></div></div>
    <div class="m-nav">
      <button class="btn secondary sm" data-nav="users">用户</button>
      <button class="btn secondary sm" data-nav="studs">学籍</button>
      <button class="btn secondary sm" data-nav="settings">设置</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
