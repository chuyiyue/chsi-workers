<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>培训档案（演示）</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap has-tabbar">
  <div class="app-header">
    <span id="inst-name">培训机构学员档案</span>
    <span class="demo-tag" id="demo-tag">演示</span>
  </div>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <button class="active" id="tab-edu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>
      教育信息</button>
    <button id="tab-me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      个人中心</button>
  </nav>
</div>

<footer id="demo-footer" class="foot-disclaimer">演示系统 · 与任何官方学历平台无任何关联</footer>

<script type="module" src="/js/main.js"></script>
<script type="module">
  // 底栏导航与路由联动（两个按钮：教育信息 / 个人中心）
  const tabIds = { "tab-edu": "#edu", "tab-me": "#me" };
  function sync() {
    const h = location.hash || "#edu";
    for (const [id, target] of Object.entries(tabIds)) {
      document.getElementById(id)?.classList.toggle("active", h.startsWith(target));
    }
  }
  window.addEventListener("hashchange", sync);
  sync();
  document.getElementById("tab-edu")?.addEventListener("click", () => location.hash = "#edu");
  document.getElementById("tab-me")?.addEventListener("click", () => location.hash = "#me");
</script>
</body>
</html>
