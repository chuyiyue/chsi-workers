<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户登录 - 学员学籍信息查询平台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar"><div class="wrap"><span>欢迎使用学员学籍信息查询与管理平台</span><span><a href="index.html">首页</a></span></div></div>
<header class="header"><div class="wrap">
  <div class="logo-mark">学</div>
  <div class="site-title"><h1>某某职业技能培训学校</h1><p>学员学籍信息查询与管理平台</p></div>
  <span class="demo-badge">演示系统 · 非官方</span>
</div></header>
<nav class="nav"><div class="wrap"><a href="index.html">首页</a><a href="index.html#query">学籍查询</a><a href="console.html">用户中心</a><a href="help.html">帮助中心</a></div></nav>

<div class="main"><div class="wrap">
  <div class="auth-box"><div class="card">
    <h2>用户登录</h2>
    <form id="login-form" style="margin-top:18px">
      <div class="field" style="margin-bottom:14px"><label>用户名</label><input name="username" placeholder="注册时的用户名 / 管理员输入 admin" autocomplete="username"></div>
      <div class="field" style="margin-bottom:14px"><label>密码</label><input name="password" type="password" placeholder="请输入密码" autocomplete="current-password"></div>
      <div class="form-msg" id="lmsg"></div>
      <div class="form-actions"><button class="btn" type="submit" style="width:100%">登 录</button></div>
    </form>
    <div class="auth-links">还没有账号？<a href="register.html">立即注册</a></div>
  </div></div>
</div></div>

<footer class="footer"><div class="wrap">
  <div>Copyright © 2026 某某职业技能培训学校 All Rights Reserved</div>
  <div class="disclaimer">本系统为演示站点，与中国高等教育学生信息网（学信网）无任何关联。</div>
</div></footer>

<script src="js/app.js"></script>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = { username: (fd.get("username") || "").trim(), password: fd.get("password") || "" };
  if (!body.username || !body.password) { showMsg("lmsg", "请输入用户名和密码"); return; }
  showMsg("lmsg", "登录中…", true);
  try {
    const d = await api("/api/login", { method: "POST", body: JSON.stringify(body) });
    showMsg("lmsg", "登录成功，正在跳转…", true);
    const next = new URLSearchParams(location.search).get("next");
    location.href = next || (d.user.role === "admin" ? "admin.html" : "console.html");
  } catch (err) { showMsg("lmsg", err.message); }
});
</script>
</body>
</html>
