<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>用户注册 - 学籍档案</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="app-header"><a class="back" href="index.html">‹</a><span>用户注册</span><span class="demo-tag">演示</span></div>
  <div class="login-wrap">
    <div class="login-logo">
      <div class="mark">学</div>
      <h2>注册账号</h2>
      <p>注册后可查看本人学籍档案（由管理员录入）</p>
    </div>
    <form id="reg-form">
      <div class="field"><label>用户名 <span class="req">*</span></label><input name="username" placeholder="3~20 位字母、数字或下划线" autocomplete="username"></div>
      <div class="field"><label>密码 <span class="req">*</span></label><input name="password" type="password" placeholder="6~64 位" autocomplete="new-password"></div>
      <div class="field"><label>确认密码 <span class="req">*</span></label><input name="password2" type="password" placeholder="再次输入密码" autocomplete="new-password"></div>
      <div class="form-msg" id="rmsg"></div>
      <button class="btn" type="submit">注 册</button>
    </form>
    <div class="login-links">已有账号？<a href="index.html">直接登录</a></div>
  </div>
  <div class="footer">
    <div class="disclaimer">演示系统 · 与中国高等教育学生信息网（学信网）无任何关联</div>
  </div>
</div>
<script src="js/app.js"></script>
<script>
document.getElementById("reg-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const username = (fd.get("username") || "").trim();
  const p1 = fd.get("password") || "", p2 = fd.get("password2") || "";
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) { showMsg("rmsg", "用户名需为 3~20 位字母、数字或下划线"); return; }
  if (p1.length < 6) { showMsg("rmsg", "密码至少 6 位"); return; }
  if (p1 !== p2) { showMsg("rmsg", "两次输入的密码不一致"); return; }
  showMsg("rmsg", "注册中…", true);
  try {
    await api("/api/register", { method: "POST", body: JSON.stringify({ username, password: p1 }) });
    showMsg("rmsg", "注册成功，正在进入…", true);
    setTimeout(() => location.href = "archive.html", 600);
  } catch (err) { showMsg("rmsg", err.message); }
});
</script>
</body>
</html>
