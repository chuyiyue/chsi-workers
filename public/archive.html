<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学籍档案 - 学员学籍档案</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar"><div class="wrap">
  <span>学员学籍档案（演示系统）</span>
  <span id="topbar-user"></span>
</div></div>
<header class="header"><div class="wrap">
  <div class="logo-mark">学</div>
  <div class="site-title"><h1>某某职业技能培训学校</h1><p>学员学籍档案管理平台</p></div>
  <div class="head-user" id="head-user"></div>
  <span class="demo-badge">演示系统 · 非官方</span>
</div></header>
<div class="archive-banner"><div class="wrap">
  <h2>学籍档案</h2>
  <p>学员学籍信息档案 · 演示系统</p>
</div></div>

<div class="wrap"><div class="layout">
  <aside class="sidebar">
    <div class="menu-title">我的档案</div>
    <a class="menu-item active" href="#xueji" data-sec="sec-xueji">学籍信息</a>
    <a class="menu-item" href="#xueli" data-sec="sec-xueli">学历信息</a>
    <div class="menu-group">其他</div>
    <a class="menu-item" href="help.html">帮助中心</a>
    <a class="menu-item" href="#" id="logout-link-2">退出登录</a>
  </aside>

  <div class="content">
    <div class="panel" id="sec-xueji">
      <h3>学籍信息</h3>
      <p class="panel-sub">以下为培训机构上报的学籍注册信息，证件号码已脱敏显示</p>
      <div id="xueji-list"><p class="empty-tip">加载中…</p></div>
    </div>
    <div class="panel" id="sec-xueli" style="display:none">
      <h3>学历信息</h3>
      <p class="panel-sub">已结业学员的学历记录</p>
      <div id="xueli-list"><p class="empty-tip">加载中…</p></div>
    </div>
    <div class="no-print" style="text-align:center">
      <button class="btn ghost" onclick="window.print()">打印本页</button>
    </div>
    <div class="watermark">以上信息由培训机构录入维护，仅供演示核验 · 本系统与学信网无关</div>
  </div>
</div></div>

<footer class="footer"><div class="wrap">
  <div>Copyright © 2026 某某职业技能培训学校 All Rights Reserved</div>
  <div class="disclaimer">本系统为演示站点，与中国高等教育学生信息网（学信网）无任何关联。</div>
</div></footer>

<script src="js/app.js"></script>
<script>
function switchSec(name) {
  document.querySelectorAll(".sidebar .menu-item[data-sec]").forEach(a => {
    a.classList.toggle("active", a.dataset.sec === "sec-" + name);
  });
  document.getElementById("sec-xueji").style.display = name === "xueji" ? "" : "none";
  document.getElementById("sec-xueli").style.display = name === "xueli" ? "" : "none";
}
document.querySelectorAll(".sidebar .menu-item[data-sec]").forEach(a => {
  a.addEventListener("click", (e) => { e.preventDefault(); switchSec(a.dataset.sec.replace("sec-", "")); history.replaceState(null, "", "#" + a.dataset.sec.replace("sec-", "")); });
});

function recordCard(r) {
  return `<div class="record-head">
      ${r.photo ? `<img class="record-photo" src="${r.photo}" alt="证件照片">` : `<div class="record-photo"></div>`}
      <div><h3 style="margin-bottom:4px">${esc(r.name)}</h3>
      <p style="color:#888;font-size:13px">${esc(r.institution)} · ${esc(r.major)} · <span class="status-pill">${esc(r.status)}</span></p></div>
    </div>` + recordTable(r, true);
}

(async function init() {
  const u = await guard();
  if (!u) return;
  if (u.role === "admin") { location.href = "admin.html"; return; }
  await renderUserHeader(u);
  const d = await api("/api/students").catch(() => ({ students: [] }));
  const recs = d.students || [];
  const xuejiEl = document.getElementById("xueji-list");
  const xueliEl = document.getElementById("xueli-list");
  if (!recs.length) {
    xuejiEl.innerHTML = `<p class="empty-tip">暂无学籍信息，请联系培训机构管理员录入。</p>`;
  } else {
    xuejiEl.innerHTML = recs.map(recordCard).join("");
  }
  const grad = recs.filter(r => r.status === "已结业");
  xueliEl.innerHTML = grad.length
    ? grad.map(recordCard).join("")
    : `<p class="empty-tip">暂无学历信息。</p>`;
  const h = (location.hash || "#xueji").replace("#", "");
  switchSec(h === "xueli" ? "xueli" : "xueji");
})();
</script>
</body>
</html>
