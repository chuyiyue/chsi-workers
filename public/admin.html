<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>管理后台 - 学籍档案</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="app-header"><span>管理后台</span><span class="demo-tag">演示</span></div>
  <div class="admin-tabs">
    <button class="active" data-tab="students">全部学籍</button>
    <button data-tab="users">用户管理</button>
    <button data-tab="add">代录学籍</button>
  </div>

  <div class="admin-body">
    <div id="tab-students"><div id="slist"><p style="text-align:center;color:#999;padding:30px">加载中…</p></div></div>

    <div id="tab-users" style="display:none"><div id="ulist"></div>
      <p style="color:#999;font-size:12px;margin-top:8px">删除用户将同时删除其名下全部学籍，不可恢复。</p>
    </div>

    <div id="tab-add" style="display:none">
      <div class="field"><label>归属用户 <span class="req">*</span></label><select id="owner-sel"><option value="">加载中…</option></select></div>
      <form id="add-form" class="form-grid"></form>
      <div style="margin-top:14px"><button class="btn" type="button" id="add-btn">保存学籍</button>
      <div class="form-msg" id="amsg"></div></div>
    </div>

    <div style="margin-top:10px"><button class="btn ghost" id="logout-btn">退出登录</button>
    <p style="text-align:center;color:#bbb;font-size:12px;margin-top:8px" id="who"></p></div>
  </div>

  <div class="footer">
    <div class="disclaimer">演示系统 · 与中国高等教育学生信息网（学信网）无任何关联</div>
  </div>
</div>
<script src="js/app.js"></script>
<script>
let users = [];
function switchTab(name) {
  document.querySelectorAll(".admin-tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  for (const t of ["students", "users", "add"]) document.getElementById("tab-" + t).style.display = t === name ? "" : "none";
}
document.querySelectorAll(".admin-tabs button").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));

async function loadStudents() {
  const d = await api("/api/students");
  const el = document.getElementById("slist");
  if (!d.students.length) { el.innerHTML = `<p style="text-align:center;color:#999;padding:30px">暂无数据</p>`; return; }
  el.innerHTML = d.students.map(s => `<div class="mini-card">
    <div class="t">${esc(s.name)} <span class="status-pill">${esc(s.status)}</span></div>
    <div class="meta">${esc(s.institution)} · ${esc(s.major)} · 归属 ${esc(s.ownerUsername)}<br>证件号 ${esc(s.idNumber)}</div>
    <div class="ops"><button class="btn small danger" data-del="${s.sid}">删除</button></div>
  </div>`).join("");
  el.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
    if (!confirm("确定删除这条学籍记录吗？")) return;
    await api("/api/students/" + b.dataset.del, { method: "DELETE" });
    loadStudents();
  }));
}

async function loadUsers() {
  const d = await api("/api/users");
  users = d.users;
  const el = document.getElementById("ulist");
  el.innerHTML = users.length ? users.map(u => `<div class="mini-card">
    <div class="t">${esc(u.username)}</div>
    <div class="meta">注册于 ${esc((u.createdAt || "").replace("T", " ").slice(0, 19))} · 名下 ${u.studentCount} 条学籍</div>
    <div class="ops"><button class="btn small danger" data-del="${u.id}">删除用户</button></div>
  </div>`).join("") : `<p style="text-align:center;color:#999;padding:30px">暂无注册用户</p>`;
  el.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
    const u = users.find(x => x.id === b.dataset.del);
    if (!confirm(`确定删除用户「${u.username}」及其名下 ${u.studentCount} 条学籍吗？不可恢复。`)) return;
    await api("/api/users/" + b.dataset.del, { method: "DELETE" });
    loadUsers(); loadStudents();
  }));
  document.getElementById("owner-sel").innerHTML = users.length
    ? users.map(u => `<option value="${esc(u.username)}">${esc(u.username)}（${u.studentCount} 条）</option>`).join("")
    : `<option value="">暂无用户，请先注册</option>`;
}

(async function init() {
  const u = await guard("admin");
  if (!u) return;
  document.getElementById("who").textContent = "管理员：" + u.username;
  document.getElementById("logout-btn").addEventListener("click", async () => {
    await api("/api/logout", { method: "POST" }).catch(() => {});
    location.href = "index.html";
  });
  const af = document.getElementById("add-form");
  af.innerHTML = studentFormHTML();
  bindPhotoInput(af);
  document.getElementById("add-btn").addEventListener("click", async () => {
    const ownerUsername = document.getElementById("owner-sel").value;
    if (!ownerUsername) { showMsg("amsg", "请先选择归属用户"); return; }
    const body = { ...collectStudentForm(af), ownerUsername };
    if (!body.name || !body.idNumber) { showMsg("amsg", "姓名和证件号码为必填项"); return; }
    showMsg("amsg", "保存中…", true);
    try {
      await api("/api/students", { method: "POST", body: JSON.stringify(body) });
      showMsg("amsg", "保存成功", true);
      af.reset(); loadStudents(); loadUsers();
    } catch (err) { showMsg("amsg", err.message); }
  });
  loadStudents(); loadUsers();
})();
</script>
</body>
</html>
