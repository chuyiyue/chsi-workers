<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - 学籍档案</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- 登录 -->
<div id="view-login" class="login-center" style="display:none">
  <div class="login-card">
    <h2>管理后台</h2>
    <p class="sub">学籍档案 · 演示系统</p>
    <form id="admin-login-form">
      <label class="fl">管理员账号</label>
      <input class="in" name="username" value="admin" autocomplete="username">
      <label class="fl">密码</label>
      <input class="in" name="password" type="password" autocomplete="current-password">
      <div class="msg" id="lmsg"></div>
      <button class="btn block" type="submit" style="margin-top:6px">登录</button>
    </form>
    <p class="demo-note">演示系统 · 与中国高等教育学生信息网（学信网）无任何关联</p>
  </div>
</div>

<!-- 主界面 -->
<div id="view-app" class="shell" style="display:none">
  <aside class="sidebar">
    <div class="brand"><span class="t">档案管理</span><span class="tag">演示</span></div>
    <nav class="nav">
      <a href="#" class="active" data-nav="users">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        用户管理</a>
    </nav>
    <div class="side-foot">管理员：admin<br><button class="btn secondary sm" id="logout-btn">退出登录</button></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="page-title">用户管理</h1>
      <button class="btn sm" id="add-user-btn">＋ 新增用户</button>
    </div>
    <div class="m-nav"><button class="btn secondary sm" data-nav="users">用户管理</button></div>
    <div class="content">

      <!-- 用户列表 -->
      <div id="pane-users">
        <div class="toolbar"><input class="in" type="search" id="user-search" placeholder="搜索用户名…"></div>
        <div class="card" style="padding:6px 20px"><div id="user-list"></div></div>
      </div>

      <!-- 用户详情 -->
      <div id="pane-user" style="display:none">
        <a class="backlink" id="user-back">← 返回用户列表</a>
        <div class="card">
          <h3>基本信息</h3>
          <p class="desc">用户账号信息</p>
          <div class="rowline"><div><b id="du-name"></b><div class="meta" id="du-meta"></div></div><span class="pill green" id="du-count"></span></div>
        </div>
        <div class="card">
          <h3>修改密码</h3>
          <p class="desc">重置该用户的登录密码</p>
          <div class="grid2">
            <div><label class="fl">新密码</label><input class="in" id="du-pw1" type="password" placeholder="6~64 位"></div>
            <div><label class="fl">确认新密码</label><input class="in" id="du-pw2" type="password" placeholder="再次输入"></div>
          </div>
          <div class="msg" id="du-pwmsg"></div>
          <button class="btn sm secondary" id="du-pwbtn" style="margin-top:10px">更新密码</button>
        </div>
        <div class="card">
          <h3>学籍档案</h3>
          <p class="desc">该用户名下的学籍 / 学历记录（代录学籍）</p>
          <div id="du-records"></div>
          <button class="btn sm" id="du-addrec" style="margin-top:12px">＋ 代录学籍</button>
        </div>
        <div class="card danger-zone">
          <h3>危险操作</h3>
          <p class="desc">删除用户将同时删除其名下全部学籍记录，不可恢复</p>
          <button class="btn sm danger" id="du-deluser">删除该用户</button>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- 新增用户弹窗 -->
<div class="overlay" id="modal-adduser" style="display:none">
  <div class="modal">
    <h3>新增用户</h3><p class="desc">创建一个可登录查看学籍档案的普通用户</p>
    <label class="fl">用户名</label><input class="in" id="au-name" placeholder="3~20 位字母、数字或下划线">
    <label class="fl">初始密码</label><input class="in" id="au-pw" type="password" placeholder="6~64 位">
    <div class="msg" id="au-msg"></div>
    <div class="modal-foot">
      <button class="btn secondary" data-close>取消</button>
      <button class="btn" id="au-ok">创建用户</button>
    </div>
  </div>
</div>

<!-- 学籍表单弹窗 -->
<div class="overlay" id="modal-record" style="display:none">
  <div class="modal">
    <h3 id="mr-title">代录学籍</h3><p class="desc" id="mr-desc"></p>
    <form id="mr-form"></form>
    <div class="msg" id="mr-msg"></div>
    <div class="modal-foot">
      <button class="btn secondary" data-close>取消</button>
      <button class="btn" id="mr-ok">保存</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
let users = [], allRecords = [], curUser = null, editSid = null;

const $ = (s) => document.querySelector(s);
function show(view) {
  $("#view-login").style.display = view === "login" ? "" : "none";
  $("#view-app").style.display = view === "app" ? "" : "none";
}
function showPane(name) {
  $("#pane-users").style.display = name === "users" ? "" : "none";
  $("#pane-user").style.display = name === "user" ? "" : "none";
  $("#page-title").textContent = name === "users" ? "用户管理" : ("用户 · " + (curUser ? curUser.username : ""));
  $("#add-user-btn").style.display = name === "users" ? "" : "none";
}
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => b.closest(".overlay").style.display = "none"));
document.querySelectorAll("[data-nav]").forEach(a => a.addEventListener("click", (e) => { e.preventDefault(); showPane("users"); }));

async function loadUsers() {
  const d = await api("/api/users");
  users = d.users || [];
  renderUserList("");
}
function renderUserList(q) {
  const el = $("#user-list");
  const list = users.filter(u => !q || u.username.includes(q));
  el.innerHTML = list.length ? list.map(u => `
    <div class="rowline">
      <div><b>${esc(u.username)}</b><div class="meta">注册于 ${esc((u.createdAt || "").replace("T", " ").slice(0, 19))}</div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="pill">${u.studentCount} 条学籍</span>
        <button class="btn sm secondary" data-manage="${u.id}">管理</button>
      </div>
    </div>`).join("")
    : `<p style="text-align:center;color:#999;padding:30px">暂无用户</p>`;
  el.querySelectorAll("[data-manage]").forEach(b => b.addEventListener("click", () => openUser(b.dataset.manage)));
}
$("#user-search").addEventListener("input", (e) => renderUserList(e.target.value.trim()));

async function openUser(id) {
  curUser = users.find(u => u.id === id);
  if (!curUser) return;
  const d = await api("/api/students");
  allRecords = (d.students || []).filter(r => r.ownerId === id);
  $("#du-name").textContent = curUser.username;
  $("#du-meta").textContent = "注册于 " + (curUser.createdAt || "").replace("T", " ").slice(0, 19);
  $("#du-count").textContent = allRecords.length + " 条学籍";
  $("#du-pw1").value = ""; $("#du-pw2").value = ""; $("#du-pwmsg").textContent = "";
  renderUserRecords();
  showPane("user");
}
function renderUserRecords() {
  const el = $("#du-records");
  el.innerHTML = allRecords.length ? allRecords.map(r => `
    <div class="rowline">
      <div><b>${esc(r.name)}</b> <span class="pill green">${esc(r.status)}</span>
        <div class="meta">${esc(r.institution)} · ${esc(r.major)} · ${esc(r.idNumber)}</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn sm secondary" data-edit="${r.sid}">编辑</button>
        <button class="btn sm danger" data-delrec="${r.sid}">删除</button>
      </div>
    </div>`).join("")
    : `<p style="color:#999;font-size:13px;padding:8px 0">暂无学籍记录</p>`;
  el.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openRecordForm(b.dataset.edit)));
  el.querySelectorAll("[data-delrec]").forEach(b => b.addEventListener("click", async () => {
    if (!confirm("确定删除这条学籍记录吗？")) return;
    await api("/api/students/" + b.dataset.delrec, { method: "DELETE" });
    const d = await api("/api/students");
    allRecords = (d.students || []).filter(r => r.ownerId === curUser.id);
    renderUserRecords(); loadUsers();
  }));
}
$("#user-back").addEventListener("click", () => showPane("users"));

// 新增用户
$("#add-user-btn").addEventListener("click", () => {
  $("#au-name").value = ""; $("#au-pw").value = ""; $("#au-msg").textContent = "";
  $("#modal-adduser").style.display = "";
});
$("#au-ok").addEventListener("click", async () => {
  const username = $("#au-name").value.trim(), password = $("#au-pw").value;
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) { showMsg("au-msg", "用户名需为 3~20 位字母、数字或下划线"); return; }
  if (password.length < 6) { showMsg("au-msg", "密码至少 6 位"); return; }
  try {
    await api("/api/users", { method: "POST", body: JSON.stringify({ username, password }) });
    $("#modal-adduser").style.display = "none"; loadUsers();
  } catch (e) { showMsg("au-msg", e.message); }
});

// 修改用户密码
$("#du-pwbtn").addEventListener("click", async () => {
  const p1 = $("#du-pw1").value, p2 = $("#du-pw2").value;
  if (p1.length < 6) { showMsg("du-pwmsg", "密码至少 6 位"); return; }
  if (p1 !== p2) { showMsg("du-pwmsg", "两次输入不一致"); return; }
  try {
    await api("/api/users/" + curUser.id, { method: "PUT", body: JSON.stringify({ password: p1 }) });
    showMsg("du-pwmsg", "密码已更新", true);
    $("#du-pw1").value = ""; $("#du-pw2").value = "";
  } catch (e) { showMsg("du-pwmsg", e.message); }
});

// 代录 / 编辑学籍
function openRecordForm(sid) {
  editSid = sid || null;
  const rec = sid ? allRecords.find(r => r.sid === sid) : null;
  $("#mr-title").textContent = sid ? "编辑学籍" : "代录学籍";
  $("#mr-desc").textContent = "归属用户：" + curUser.username;
  const f = $("#mr-form");
  f.innerHTML = studentFormHTML(rec || {});
  bindPhotoInput(f);
  $("#mr-msg").textContent = "";
  $("#modal-record").style.display = "";
}
$("#du-addrec").addEventListener("click", () => openRecordForm(null));
$("#mr-ok").addEventListener("click", async () => {
  const f = $("#mr-form");
  const body = collectStudentForm(f);
  if (!body.name || !body.idNumber) { showMsg("mr-msg", "姓名和证件号码为必填项"); return; }
  try {
    if (editSid) {
      await api("/api/students/" + editSid, { method: "PUT", body: JSON.stringify(body) });
    } else {
      body.ownerUsername = curUser.username;
      await api("/api/students", { method: "POST", body: JSON.stringify(body) });
    }
    $("#modal-record").style.display = "none";
    const d = await api("/api/students");
    allRecords = (d.students || []).filter(r => r.ownerId === curUser.id);
    renderUserRecords(); loadUsers();
  } catch (e) { showMsg("mr-msg", e.message); }
});

// 删除用户
$("#du-deluser").addEventListener("click", async () => {
  if (!confirm(`确定删除用户「${curUser.username}」及其名下 ${allRecords.length} 条学籍吗？不可恢复。`)) return;
  await api("/api/users/" + curUser.id, { method: "DELETE" });
  curUser = null; showPane("users"); loadUsers();
});

$("#logout-btn").addEventListener("click", async () => {
  await api("/api/logout", { method: "POST" }).catch(() => {});
  location.reload();
});

// 管理员登录
$("#admin-login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    const d = await api("/api/login", { method: "POST", body: JSON.stringify({ username: fd.get("username"), password: fd.get("password") }) });
    if (d.user.role !== "admin") { await api("/api/logout", { method: "POST" }).catch(() => {}); showMsg("lmsg", "此入口仅限管理员"); return; }
    location.reload();
  } catch (err) { showMsg("lmsg", err.message); }
});

(async function init() {
  const u = await currentUser();
  if (u && u.role === "admin") { show("app"); loadUsers(); }
  else show("login");
})();
</script>
</body>
</html>
