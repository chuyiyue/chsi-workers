<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - 学籍档案</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- 登录 -->
<div id="view-login" class="login-center" style="display:none">
  <div class="login-card">
    <h2>管理后台</h2>
    <p class="sub">学籍档案 · 演示系统</p>
    <form id="admin-login-form">
      <label class="fl">管理员密码</label>
      <input class="in" name="password" type="password" autocomplete="current-password" autofocus placeholder="请输入管理员密码">
      <div class="msg" id="lmsg"></div>
      <button class="btn block" type="submit" style="margin-top:6px">登录</button>
    </form>
    <p class="demo-note">演示系统 · 与中国高等教育学生信息网（学信网）无任何关联</p>
  </div>
</div>

<!-- 主界面 -->
<div id="view-app" class="shell" style="display:none">
  <aside class="sidebar">
    <div class="brand"><span class="t" data-site-name>档案管理</span><span class="tag">演示</span></div>
    <nav class="nav">
      <a href="#" class="active" data-nav="users">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        用户管理</a>
      <a href="#" data-nav="records">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
        学籍管理</a>
      <a href="#" data-nav="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        网站设置</a>
    </nav>
    <div class="side-foot">管理员：admin<br><button class="btn secondary sm" id="logout-btn">退出登录</button></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="page-title">用户管理</h1>
      <button class="btn sm" id="topbar-btn">＋ 新增用户</button>
    </div>
    <div class="m-nav">
      <button class="btn secondary sm active" data-nav="users">用户管理</button>
      <button class="btn secondary sm" data-nav="records">学籍管理</button>
      <button class="btn secondary sm" data-nav="settings">网站设置</button>
    </div>
    <div class="content">

      <!-- 用户管理 -->
      <div id="pane-users">
        <div class="toolbar"><input class="in" type="search" id="user-search" placeholder="搜索用户名…"></div>
        <div class="card" style="padding:6px 20px"><div id="user-list"></div></div>
      </div>

      <!-- 学籍管理 -->
      <div id="pane-records" style="display:none">
        <div class="filter-row">
          <input class="in" type="search" id="rec-search" placeholder="搜索姓名 / 用户名 / 学校 / 专业…">
          <select class="in" id="rec-status">
            <option value="">全部状态</option><option>在读</option><option>已结业</option><option>休学</option><option>退学</option>
          </select>
        </div>
        <div class="card" style="padding:6px 20px"><div id="record-list"></div></div>
      <!-- 网站设置 -->
      <div id="pane-settings" style="display:none">
        <div class="card">
          <h3>网站信息</h3>
          <p class="desc">保存后即时在全站生效</p>
          <label class="fl">网站名字</label>
          <input class="in" id="set-siteName" placeholder="如：学籍档案" maxlength="40">
          <label class="fl">网站 Icon（浏览器标签页小图标）</label>
          <div style="display:flex;gap:12px;align-items:flex-start">
            <img id="set-icon-prev" style="width:44px;height:44px;border-radius:10px;border:1px solid #e5e7eb;object-fit:cover;flex:none;background:#f3f4f6">
            <div style="flex:1;min-width:0">
              <input type="file" id="set-icon-file" accept="image/*" style="width:100%">
              <input class="in" id="set-icon-url" placeholder="或粘贴图片外链 URL（https://…）" style="margin-top:8px">
              <input type="hidden" id="set-icon">
            </div>
          </div>
          <label class="fl">头像 / Logo（登录页展示）</label>
          <div style="display:flex;gap:12px;align-items:flex-start">
            <img id="set-avatar-prev" style="width:44px;height:44px;border-radius:50%;border:1px solid #e5e7eb;object-fit:cover;flex:none;background:#f3f4f6">
            <div style="flex:1;min-width:0">
              <input type="file" id="set-avatar-file" accept="image/*" style="width:100%">
              <input class="in" id="set-avatar-url" placeholder="或粘贴图片外链 URL（https://…）" style="margin-top:8px">
              <input type="hidden" id="set-avatar">
            </div>
          </div>
          <label class="fl">底栏信息</label>
          <input class="in" id="set-footerText" placeholder="页脚显示的文字" maxlength="120">
          <label class="fl">是否展示全局右上角"演示"标记</label>
          <select class="in" id="set-showDemoBadge">
            <option value="1">展示</option>
            <option value="0">隐藏</option>
          </select>
          <div class="msg" id="set-msg"></div>
          <button class="btn" id="set-save" style="margin-top:14px">保存设置</button>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- 新增用户 -->
<div class="overlay" id="modal-adduser" style="display:none">
  <div class="modal">
    <h3>新增用户</h3><p class="desc">创建一个可登录查看学籍档案的普通用户</p>
    <label class="fl">用户名</label><input class="in" id="au-name" placeholder="3~20 位字母、数字或下划线">
    <label class="fl">初始密码</label><input class="in" id="au-pw" type="password" placeholder="6~64 位">
    <div class="msg" id="au-msg"></div>
    <div class="modal-foot">
      <button class="btn secondary" data-close>取消</button>
      <button class="btn" id="au-ok">创建用户</button>
    </div>
  </div>
</div>

<!-- 修改密码 -->
<div class="overlay" id="modal-pw" style="display:none">
  <div class="modal">
    <h3>修改密码</h3><p class="desc" id="pw-desc"></p>
    <label class="fl">新密码</label><input class="in" id="pw1" type="password" placeholder="6~64 位">
    <label class="fl">确认新密码</label><input class="in" id="pw2" type="password" placeholder="再次输入">
    <div class="msg" id="pw-msg"></div>
    <div class="modal-foot">
      <button class="btn secondary" data-close>取消</button>
      <button class="btn" id="pw-ok">更新密码</button>
    </div>
  </div>
</div>

<!-- 学籍表单 -->
<div class="overlay" id="modal-record" style="display:none">
  <div class="modal" style="max-width:680px">
    <h3 id="mr-title">新增学籍</h3><p class="desc" id="mr-desc"></p>
    <div id="mr-owner-wrap" style="display:none">
      <label class="fl">所属用户</label><select class="in" id="mr-owner"></select>
    </div>
    <form id="mr-form"></form>
    <div class="msg" id="mr-msg"></div>
    <div class="modal-foot">
      <button class="btn secondary" data-close>取消</button>
      <button class="btn" id="mr-ok">保存</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
let users = [], records = [], pwUserId = null, editSid = null;
const $ = (s) => document.querySelector(s);

function show(view) {
  $("#view-login").style.display = view === "login" ? "" : "none";
  $("#view-app").style.display = view === "app" ? "" : "none";
}
function showPane(name) {
  const titles = { users: "用户管理", records: "学籍管理", settings: "网站设置" };
  $("#pane-users").style.display = name === "users" ? "" : "none";
  $("#pane-records").style.display = name === "records" ? "" : "none";
  $("#pane-settings").style.display = name === "settings" ? "" : "none";
  $("#page-title").textContent = titles[name] || "";
  const btn = $("#topbar-btn");
  if (name === "users") { btn.style.display = ""; btn.textContent = "＋ 新增用户"; }
  else if (name === "records") { btn.style.display = ""; btn.textContent = "＋ 新增学籍"; }
  else btn.style.display = "none";
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("active", a.dataset.nav === name));
}
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => b.closest(".overlay").style.display = "none"));
document.querySelectorAll("[data-nav]").forEach(a => a.addEventListener("click", (e) => { e.preventDefault(); showPane(a.dataset.nav); }));
$("#topbar-btn").addEventListener("click", () => {
  if ($("#pane-users").style.display !== "none") openAddUser();
  else openRecordModal(null);
});

/* ---------- 用户管理 ---------- */
async function loadUsers() {
  const d = await api("/api/users");
  users = d.users || [];
  renderUserList();
}
function renderUserList() {
  const q = $("#user-search").value.trim();
  const list = users.filter(u => !q || u.username.includes(q));
  $("#user-list").innerHTML = list.length ? list.map(u => `
    <div class="rowline">
      <div><b>${esc(u.username)}</b><div class="meta">注册于 ${esc((u.createdAt || "").replace("T", " ").slice(0, 19))}</div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="pill">${u.studentCount} 条学籍</span>
        <button class="btn sm secondary" data-pw="${u.id}">改密码</button>
        <button class="btn sm danger" data-deluser="${u.id}" data-uname="${esc(u.username)}">删除</button>
      </div>
    </div>`).join("")
    : `<p style="text-align:center;color:#999;padding:30px">暂无用户</p>`;
  $("#user-list").querySelectorAll("[data-pw]").forEach(b => b.addEventListener("click", () => openPwModal(b.dataset.pw)));
  $("#user-list").querySelectorAll("[data-deluser]").forEach(b => b.addEventListener("click", () => deleteUser(b.dataset.deluser, b.dataset.uname)));
}
$("#user-search").addEventListener("input", renderUserList);

function openAddUser() {
  $("#au-name").value = ""; $("#au-pw").value = ""; $("#au-msg").textContent = "";
  $("#modal-adduser").style.display = "";
}
$("#au-ok").addEventListener("click", async () => {
  const username = $("#au-name").value.trim(), password = $("#au-pw").value;
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) { showMsg("au-msg", "用户名需为 3~20 位字母、数字或下划线"); return; }
  if (password.length < 6) { showMsg("au-msg", "密码至少 6 位"); return; }
  try {
    await api("/api/users", { method: "POST", body: JSON.stringify({ username, password }) });
    $("#modal-adduser").style.display = "none"; loadUsers();
  } catch (e) { showMsg("au-msg", e.message); }
});

function openPwModal(id) {
  pwUserId = id;
  const u = users.find(x => x.id === id);
  $("#pw-desc").textContent = "重置用户「" + (u ? u.username : "") + "」的登录密码";
  $("#pw1").value = ""; $("#pw2").value = ""; $("#pw-msg").textContent = "";
  $("#modal-pw").style.display = "";
}
$("#pw-ok").addEventListener("click", async () => {
  const p1 = $("#pw1").value, p2 = $("#pw2").value;
  if (p1.length < 6) { showMsg("pw-msg", "密码至少 6 位"); return; }
  if (p1 !== p2) { showMsg("pw-msg", "两次输入不一致"); return; }
  try {
    await api("/api/users/" + pwUserId, { method: "PUT", body: JSON.stringify({ password: p1 }) });
    $("#modal-pw").style.display = "none";
  } catch (e) { showMsg("pw-msg", e.message); }
});

async function deleteUser(id, uname) {
  const u = users.find(x => x.id === id);
  if (!confirm(`确定删除用户「${uname}」及其名下 ${u ? u.studentCount : 0} 条学籍吗？不可恢复。`)) return;
  await api("/api/users/" + id, { method: "DELETE" });
  loadUsers(); loadRecords();
}

/* ---------- 学籍管理 ---------- */
async function loadRecords() {
  const d = await api("/api/students");
  records = d.students || [];
  renderRecordList();
}
function renderRecordList() {
  const q = $("#rec-search").value.trim();
  const st = $("#rec-status").value;
  const list = records.filter(r =>
    (!q || (r.name + r.ownerUsername + (r.institution || "") + (r.major || "")).includes(q)) &&
    (!st || r.status === st));
  $("#record-list").innerHTML = list.length ? list.map(r => `
    <div class="rowline">
      <div><b>${esc(r.name)}</b> <span class="pill green">${esc(r.status)}</span>
        ${(r.custom && r.custom.length) ? `<span class="pill">＋${r.custom.length} 自定义</span>` : ""}
        <div class="meta">@${esc(r.ownerUsername)} · ${esc(r.institution)} · ${esc(r.major)}</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn sm secondary" data-edit="${r.sid}">编辑</button>
        <button class="btn sm danger" data-delrec="${r.sid}">删除</button>
      </div>
    </div>`).join("")
    : `<p style="text-align:center;color:#999;padding:30px">暂无学籍记录</p>`;
  $("#record-list").querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openRecordModal(b.dataset.edit)));
  $("#record-list").querySelectorAll("[data-delrec]").forEach(b => b.addEventListener("click", async () => {
    if (!confirm("确定删除这条学籍记录吗？")) return;
    await api("/api/students/" + b.dataset.delrec, { method: "DELETE" });
    loadRecords(); loadUsers();
  }));
}
$("#rec-search").addEventListener("input", renderRecordList);
$("#rec-status").addEventListener("change", renderRecordList);

/* 学籍表单（管理后台统一风格） */
const ADMIN_FIELDS = [
  ["name", "姓名", "text", 1], ["gender", "性别", "select:;男;女", 0],
  ["idType", "证件类型", "text", 0], ["idNumber", "证件号码", "text", 1],
  ["ethnicity", "民族", "text", 0], ["birthdate", "出生日期", "text", 0],
  ["institution", "学校", "text", 0], ["level", "层次", "text", 0],
  ["major", "专业", "text", 0], ["studyMode", "学习形式", "text", 0],
  ["eduCategory", "学历类别", "text", 0], ["duration", "学制", "text", 0],
  ["branch", "分院", "text", 0], ["dept", "系所", "text", 0],
  ["className", "班级", "text", 0], ["studentNo", "学号", "text", 0],
  ["enrollDate", "入学日期", "text", 0], ["gradDate", "毕（结）业日期", "text", 0],
  ["status", "学籍状态", "select:在读;已结业;休学;退学", 0],
  ["gradType", "毕（结）业", "select:;毕业;结业", 0],
  ["presidentName", "校（院）长姓名", "text", 0], ["certNo", "证书编号", "text", 0],
  ["degreeName", "学位名称", "text", 0], ["degreeUnit", "学位授予单位", "text", 0],
  ["published", "是否公开可查", "select:1:是;0:否", 0],
  ["remark", "备注", "text", 0],
];
function adminFieldHTML(key, label, type, req, values) {
  const v = values[key] == null ? "" : values[key];
  const reqMark = req ? ' <span style="color:#dc2626">*</span>' : "";
  if (type.startsWith("select:")) {
    const opts = type.slice(7).split(";").map(o => {
      const [val, text] = o.includes(":") ? o.split(":") : [o, o === "" ? "请选择" : o];
      const cur = key === "published" ? String(values.published !== false ? "1" : "0") : String(v);
      return `<option value="${esc(val)}" ${val === cur ? "selected" : ""}>${esc(text)}</option>`;
    }).join("");
    return `<div><label class="fl">${label}${reqMark}</label><select class="in" name="${key}">${opts}</select></div>`;
  }
  const def = key === "institution" && !v ? INSTITUTION : v;
  return `<div><label class="fl">${label}${reqMark}</label><input class="in" name="${key}" value="${esc(def)}"></div>`;
}
function adminRecordFormHTML(values = {}) {
  let h = `<div class="grid2">`;
  for (const [key, label, type, req] of ADMIN_FIELDS) h += adminFieldHTML(key, label, type, req, values);
  h += `</div>`;
  h += `<div class="cf-wrap">` + photoFieldHTML("photo", "录取照片", values.photo) + `</div>`;
  h += `<div class="cf-wrap">` + photoFieldHTML("photo2", "学历照片", values.photo2) + `</div>`;
  h += customFieldsEditorHTML(values.custom, "cf-wrap", "fl");
  return h;
}

function openRecordModal(sid) {
  editSid = sid || null;
  const rec = sid ? records.find(r => r.sid === sid) : null;
  $("#mr-title").textContent = sid ? "编辑学籍" : "新增学籍";
  const ow = $("#mr-owner-wrap");
  if (sid) {
    ow.style.display = "none";
    $("#mr-desc").textContent = "所属用户：@" + rec.ownerUsername;
  } else {
    ow.style.display = "";
    $("#mr-desc").textContent = "为指定用户代录一条学籍 / 学历记录（状态选已结业即同步为学历）";
    $("#mr-owner").innerHTML = users.map(u => `<option value="${esc(u.username)}">${esc(u.username)}</option>`).join("");
  }
  const f = $("#mr-form");
  f.innerHTML = adminRecordFormHTML(rec || {});
  bindPhotoInput(f); bindCustomFields(f);
  $("#mr-msg").textContent = "";
  $("#modal-record").style.display = "";
}
$("#mr-ok").addEventListener("click", async () => {
  const body = collectStudentForm($("#mr-form"));
  if (!body.name || !body.idNumber) { showMsg("mr-msg", "姓名和证件号码为必填项"); return; }
  try {
    if (editSid) {
      await api("/api/students/" + editSid, { method: "PUT", body: JSON.stringify(body) });
    } else {
      body.ownerUsername = $("#mr-owner").value;
      if (!body.ownerUsername) { showMsg("mr-msg", "请先创建用户"); return; }
      await api("/api/students", { method: "POST", body: JSON.stringify(body) });
    }
    $("#modal-record").style.display = "none";
    loadRecords(); loadUsers();
  } catch (e) { showMsg("mr-msg", e.message); }
});

$("#logout-btn").addEventListener("click", async () => {
  await api("/api/logout", { method: "POST" }).catch(() => {});
  location.reload();
});

$("#admin-login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = new FormData(e.target).get("password") || "";
  if (!pw) { showMsg("lmsg", "请输入管理员密码"); return; }
  try {
    await api("/api/admin-login", { method: "POST", body: JSON.stringify({ password: pw }) });
    location.reload();
  } catch (err) { showMsg("lmsg", err.message); }
});

/* ---------- 网站设置 ---------- */
function bindSettingsImage(name) {
  const file = $("#set-" + name + "-file"), url = $("#set-" + name + "-url"),
        hidden = $("#set-" + name), prev = $("#set-" + name + "-prev");
  const setVal = (v) => { hidden.value = v; prev.src = v || ""; prev.style.visibility = v ? "" : "hidden"; };
  file.addEventListener("change", () => {
    const f = file.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { setVal(rd.result); url.value = ""; };
    rd.readAsDataURL(f);
  });
  url.addEventListener("change", () => {
    const u = url.value.trim();
    if (u && !/^https?:\/\//i.test(u)) { showMsg("set-msg", "外链需以 http:// 或 https:// 开头"); return; }
    setVal(u); file.value = "";
  });
  return setVal;
}
let setIconVal, setAvatarVal;
async function loadSettings() {
  const d = await api("/api/settings").catch(() => null);
  const s = (d && d.settings) || {};
  $("#set-siteName").value = s.siteName || "";
  $("#set-footerText").value = s.footerText || "";
  $("#set-showDemoBadge").value = s.showDemoBadge === false ? "0" : "1";
  setIconVal(s.icon || ""); setAvatarVal(s.avatar || "");
}
$("#set-save").addEventListener("click", async () => {
  const body = {
    siteName: $("#set-siteName").value.trim(),
    icon: $("#set-icon").value,
    avatar: $("#set-avatar").value,
    footerText: $("#set-footerText").value.trim(),
    showDemoBadge: $("#set-showDemoBadge").value !== "0",
  };
  try {
    await api("/api/settings", { method: "PUT", body: JSON.stringify(body) });
    showMsg("set-msg", "已保存，全站即时生效", true);
  } catch (e) { showMsg("set-msg", e.message); }
});

(async function init() {
  applySettings();
  const u = await currentUser();
  if (u && u.role === "admin") {
    show("app");
    setIconVal = bindSettingsImage("icon");
    setAvatarVal = bindSettingsImage("avatar");
    loadUsers(); loadRecords(); loadSettings();
  }
  else if (u) location.href = "archive.html"; // 普通用户不看管理页
  else show("login");
})();
</script>
</body>
</html>
