<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>用户登录 - 学籍档案</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="app-header"><span>用户登录</span><span class="demo-tag">演示</span></div>
  <div class="login-wrap">
    <div class="login-logo">
      <div class="mark">学</div>
      <h2>学籍档案</h2>
      <p>某某职业技能培训学校 · 演示系统</p>
    </div>
    <form id="login-form">
      <div class="field"><label>用户名</label><input name="username" placeholder="请输入用户名" autocomplete="username"></div>
      <div class="field"><label>密码</label><input name="password" type="password" placeholder="请输入密码" autocomplete="current-password"></div>
      <div class="form-msg" id="lmsg"></div>
      <button class="btn" type="submit">登 录</button>
    </form>
    <div class="login-links"><a href="register.html">立即注册</a><span style="color:#ddd">|</span><a href="help.html">帮助中心</a></div>
    <p style="text-align:center;color:#bbb;font-size:12px;margin-top:14px">管理员请使用 admin 账号登录</p>
  </div>
  <div class="footer">
    <div>Copyright © 2026 某某职业技能培训学校</div>
    <div class="disclaimer">演示系统 · 与中国高等教育学生信息网（学信网）无任何关联</div>
  </div>
</div>
<script src="js/app.js"></script>
<script>
(async function () {
  const u = await currentUser();
  if (u) { location.href = u.role === "admin" ? "admin.html" : "archive.html"; return; }
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const body = { username: (fd.get("username") || "").trim(), password: fd.get("password") || "" };
    if (!body.username || !body.password) { showMsg("lmsg", "请输入用户名和密码"); return; }
    showMsg("lmsg", "登录中…", true);
    try {
      const d = await api("/api/login", { method: "POST", body: JSON.stringify(body) });
      showMsg("lmsg", "登录成功，正在进入…", true);
      const next = new URLSearchParams(location.search).get("next");
      setTimeout(() => { location.href = next || (d.user.role === "admin" ? "admin.html" : "archive.html"); }, 400);
    } catch (err) { showMsg("lmsg", err.message); }
  });
})();
</script>
</body>
</html>
